# Server Configuration
server.port=3000

# Application Name
spring.application.name=poi-search-api

# AWS Location Service Configuration
# IMPORTANT: You must create a Place Index in AWS Location Service console first
# Navigate to: AWS Console > Amazon Location Service > Place indexes > Create place index
aws.region=us-east-1
aws.access-key-id=your_aws_access_key_here
aws.secret-access-key=your_aws_secret_key_here
# Place Index name (REQUIRED for SearchPlaceIndexForText API)
# Example: MyPlaceIndex
aws.location.index-name=your_place_index_name

# Google Maps Configuration
google.maps.api-key=your_google_maps_api_key_here

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.poisearch=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
